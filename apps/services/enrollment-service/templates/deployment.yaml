apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  labels:
    app: {{ .Values.appName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
        - name: {{ .Values.appName }}
          image: {{ .Values.container.image | quote }}
          imagePullPolicy: {{ .Values.container.imagePullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP

          env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-auth
                key: password
          - name: POSTGRES_USER
            value: {{ .Values.appsettings.database.username | quote }}
          - name: POSTGRES_DB
            value: {{ .Values.appsettings.database.name | quote }}
          - name: DB_HOST
            value: {{ .Values.appsettings.database.host | quote }}
          - name: DB_PORT
            value: {{ .Values.appsettings.database.port | quote }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: app-config
              mountPath: /config/appsettings.json
              subPath: appsettings.json
              readOnly: true

      volumes:
        - name: app-config
          configMap:
            name: {{ .Values.appName }}-config