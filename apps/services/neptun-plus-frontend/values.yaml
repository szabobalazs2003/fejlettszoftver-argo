replicaCount: 1
appName: neptun-plus-frontend
container:
  image: ghcr.io/dlevy004/neptun-plus-frontend-main:4f59dc2
  imagePullPolicy: IfNotPresent
  port: 5173
service:
  type: ClusterIP
  port: 80
env:
  VITE_ENROLLMENT_API_BASE_URL: "http://enrollment-service.apps.svc.cluster.local"
  VITE_ACCOUNT_API_BASE_URL: "http://login-service.apps.svc.cluster.local"
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1024Mi
appsettings:
