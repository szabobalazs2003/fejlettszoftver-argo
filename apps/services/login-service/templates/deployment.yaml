apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-service
  labels:
    app: login-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: login-service
  template:
    metadata:
      labels:
        app: login-service
    spec:
      containers:
        - name: login-service
          image: {{ .Values.container.image | quote }}
          imagePullPolicy: {{ .Values.container.imagePullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP

          env:
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-auth
                key: password

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: app-config
              mountPath: /config/appsettings.json
              subPath: appsettings.json
              readOnly: true

      volumes:
        - name: app-config
          configMap:
            name: login-service-config