replicaCount: 1
appName: login-service
container:
  image: ghcr.io/szabobalazs2003/fejlettszoftver-login-service-main:611c16a
  imagePullPolicy: IfNotPresent
  port: 8080
service:
  type: ClusterIP
  port: 80
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
appsettings:
  database:
    name: "postgres"
    host: "postgres-postgresql.postgres.svc.cluster.local"
    port: 5432
    username: "appuser"
