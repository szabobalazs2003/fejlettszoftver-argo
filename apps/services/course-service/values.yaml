replicaCount: 1
appName: course-service
container:
  image: ghcr.io/czeitnerandras/course_service-main:e535ce7
  imagePullPolicy: IfNotPresent
  port: 8080
service:
  type: ClusterIP
  port: 80
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
env:
  DATABASE_URL: "postgres://postgres:$(DB_PASSWORD)@postgres-postgresql.postgres.svc.cluster.local:5432/course_db"
  CACHE_TTL_SECONDS: 10
appsettings:
  database:
    name: "course_db"
    host: "postgres-postgresql.postgres.svc.cluster.local"
    port: 5432
    username: "appuser"
