apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: neptun-plus-frontend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Dlevy004/neptun-plus-frontend.git
    targetRevision: main
    path: apps/services/neptun-plus-frontend
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true