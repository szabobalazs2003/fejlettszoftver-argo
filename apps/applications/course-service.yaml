apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: course-service
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/CzeitnerAndras/course_service.git
    targetRevision: main
    path: apps/services/course-service
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true